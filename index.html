<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="icon" href="https://pngimg.com/uploads/rpg/rpg_PNG26663.png">
</head>
<body>
    <main id="geral">
        <div id="começo">
        <h1>Sistema Pontos RPG</h1></div>
        <div id="pontos-geral">
            <h3>PONTOS RESTANTES</h3>
            <p id="numero-geral">10/10</p>
            <div class="barra">
                <div id="barra-geral">
                </div>
            </div>
        </div>
        <div id="pontos-força">
            <h4>Pontos de Força</h4>
            <p>0/10</p>
            <div class="barra">
                <div id="barra-força">
                </div>
            </div>
            <button class="botao-ponto menos" id="menos-força">-</button>
            <button class="botao-ponto mais" id="mais-força">+</button>
        </div>
        <div id="pontos-destreza">
            <h4>Pontos de Destreza</h4>
            <p>0/10</p>
            <div class="barra">
                <div id="barra-destreza">
                </div>
            </div>
            <button class="botao-ponto menos" id="menos-destreza">-</button>
            <button class="botao-ponto mais" id="mais-destreza">+</button>
        </div>
        <div id="pontos-intelecto">
            <h4>Pontos de Intelecto</h4>
            <p>0/10</p>
            <div class="barra">
                <div id="barra-intelecto">
                </div>
            </div>
            <button class="botao-ponto menos" id="menos-intelecto">-</button>
            <button class="botao-ponto mais" id="mais-intelecto">+</button>
        </div>
    </main>
    <div style=" margin-top: -200px;">
    <a href="./2pag.html" id="botao-final"><button style="padding: 50px; background-color: yellow; font-weight: bold;cursor: pointer ">ENVIAR</button></a></div>

    
</body>

</html>
<!-- Um sistema de pontos de rpg. Tem os atributos força, destreza e intelecto e vc tem 10 pontos no total pra distribuir entre eles. Tem que ter botão de + e de -, pra adicionar e diminuir pontos, respectivamente, e tem que ter uma barra horizontal pra cada atributo que cresce ou diminui conforme a quantidade de pontos dela. O botão de + tem que travar quando não der mais pra adicionar pontos, e o de - tem que travar quando não der mais pra retirar pontos 
tem que atualizar em tempo real -->
